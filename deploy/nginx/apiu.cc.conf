server {
    listen 80;
    listen [::]:80;
    server_name apiu.cc;
    server_tokens off;

    location / {
        return 308 https://apiu.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apiu.cc;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/apiu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiu.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location ^~ /api/cron/sync {
        access_log off;
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=120, stale-while-revalidate=600" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
